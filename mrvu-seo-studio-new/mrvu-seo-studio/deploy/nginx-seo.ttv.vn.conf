# /etc/nginx/sites-available/seo.ttv.vn
# Sau khi chép file này, chạy: sudo certbot --nginx -d seo.ttv.vn  (certbot tự thêm phần HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name seo.ttv.vn;

    client_max_body_size 20m;          # tải file khóa Google, CSV backlink, ảnh

    # Ẩn khỏi Google: đây là công cụ nội bộ
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8686;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;        # AI viết bài, đồng bộ Search Console có thể mất 1–3 phút
        proxy_send_timeout 300s;
    }
}
